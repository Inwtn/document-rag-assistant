[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-rag-assistant"
version = "1.0.0"
description = "A grounded document Q&A assistant with source citations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=2,<4",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["rag_assistant*"]

[tool.setuptools.package-data]
rag_assistant = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

