<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Q&A</title><style>
body{margin:0;background:#101827;color:#e9effa;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{box-sizing:border-box;width:min(720px,92vw);background:#182438;padding:32px;border-radius:18px}h1{margin-top:0}p{color:#b8c6da}textarea{box-sizing:border-box;width:100%;min-height:110px;padding:14px;border-radius:10px;background:#0f1928;color:white;border:1px solid #60718a;font:inherit}button{margin-top:12px;padding:11px 18px;border:0;border-radius:8px;background:#7dd3fc;color:#102033;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#result{white-space:pre-wrap;line-height:1.6;margin-top:22px}.source{display:inline-block;margin:8px 8px 0 0;padding:5px 9px;border:1px solid #526781;border-radius:99px;color:#a8def7;font-size:13px}
</style></head><body><main><h1>Ask your documents</h1><p>Find answers in your indexed files, with source citations.</p><form id="form"><label for="question">Your question</label><textarea id="question" minlength="3" maxlength="2000" required placeholder="What is the refund window?"></textarea><button>Ask question</button></form><div id="result" role="status" aria-live="polite"></div><script>
const form=document.querySelector('#form'),result=document.querySelector('#result'),button=form.querySelector('button');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;result.textContent='Searching your documents…';try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#question').value})});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Request failed. Please check your question.');result.replaceChildren();const answer=document.createElement('p');answer.textContent=data.answer;result.append(answer);for(const source of data.citations){const tag=document.createElement('span');tag.className='source';tag.textContent=source.filename;result.append(tag)}}catch(err){result.textContent=err.message}finally{button.disabled=false}});
</script></main></body></html>
